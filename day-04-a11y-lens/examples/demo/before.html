<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>예제몰 – 로그인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
</head>
<body>
<div id="top">
  <a href="/"><img src="/img/logo.png"></a>
  <a href="/cart"><svg width="20" height="20"></svg></a>
</div>
<div id="main">
  <h1>로그인</h1>
  <h4>회원</h4>
  <form accept-charset="utf-8">
    <input id="email" type="email" placeholder="이메일">
    <label for="pw">비밀번호</label>
    <input id="password" type="password">
    <button type="submit"><svg width="16" height="16"></svg></button>
  </form>
  <p>비밀번호를 잊으셨나요? <a href="/find">여기</a></p>
  <table>
    <tr><td>상품</td><td>가격</td></tr>
    <tr><td>텀블러</td><td>12,000원</td></tr>
  </table>
  <iframe src="https://map.example/embed"></iframe>
  <div aria-hidden="true"><button type="button">닫기</button></div>
  <div id="notice">공지</div>
  <div id="notice">이벤트</div>
  <span tabindex="2">바로가기</span>
</div>
</body>
</html>
