[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-context-mcp"
version = "0.1.0"
description = "Filesystem MCP × git MCP — one read-only, token-budgeted repository context server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "where-is-the-error" }]
keywords = ["mcp", "model-context-protocol", "git", "codebase", "context"]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
repo-context = "repo_context.cli:main"
repo-context-mcp = "repo_context.server:main"

[tool.setuptools.packages.find]
include = ["repo_context*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
