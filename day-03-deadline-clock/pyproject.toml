[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadline-clock-mcp"
version = "0.1.0"
description = "Time MCP × SQLite MCP — deadlines stored as instants with a time zone, not dates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "where-is-the-error" }]
keywords = ["mcp", "model-context-protocol", "deadline", "timezone", "sqlite", "dst"]

dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deadline-clock = "deadline_clock.cli:main"
deadline-clock-mcp = "deadline_clock.server:main"

[tool.setuptools.packages.find]
include = ["deadline_clock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
